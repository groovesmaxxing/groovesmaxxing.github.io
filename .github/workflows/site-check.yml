name: site check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: preflight (tags, links, anchors, embeds, noopener, fonts, json-ld, sitemap, banned strings)
        env:
          BANNED_STRINGS: ${{ secrets.BANNED_STRINGS }}
        run: python3 .github/scripts/preflight.py
      - name: the security tags on every page are current
        run: python3 .github/scripts/harden_pages.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: install a browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: serve the site and load the pages
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          NODE_PATH=$PWD/node_modules node .github/scripts/sitecheck.js
      - name: render proof (phone and desktop screenshots of the key pages)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-proof
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

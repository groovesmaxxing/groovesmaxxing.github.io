name: site check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: the security tags on every page are current
        run: python3 .github/scripts/harden_pages.py --check
      - name: install a browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: serve the site and load the pages
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          NODE_PATH=$PWD/node_modules node .github/scripts/sitecheck.js

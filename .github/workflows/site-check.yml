name: site check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # the checkout is two commits deep, so a push of several commits would leave its base out of the clone and
      # asset_tags would only see the last commit. fetch the base tree (depth 1 is enough for diff and grep)
      - name: the push base, so every commit of a multi-commit push is checked
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || echo "::warning::push base $BEFORE could not be fetched (force push?)"
          fi
      - name: a shared script or stylesheet that changed moved to a fresh ?v= tag (the zone caches them 4 hours)
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/asset_tags.py --range "${BEFORE:-HEAD~1}..${{ github.sha }}"
      - name: preflight (tags, links, anchors, embeds, noopener, fonts, json-ld, sitemap, banned strings)
        env:
          BANNED_STRINGS: ${{ secrets.BANNED_STRINGS }}
        run: python3 .github/scripts/preflight.py
      - name: the security tags on every page are current
        run: python3 .github/scripts/harden_pages.py --check
      - name: the app's offline list holds every page and asset it promises (build_precache.py and the sw.js shell)
        run: python3 .github/scripts/build_precache.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: install a browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: serve the site and load the pages
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          NODE_PATH=$PWD/node_modules node .github/scripts/sitecheck.js
      - name: render proof (phone and desktop screenshots of the key pages)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-proof
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

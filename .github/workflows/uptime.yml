name: recognizer uptime

# every 20 minutes, ask the recognizer's public api for a page. no answer, a timeout or a 5xx is a miss.
# a miss uploads an uptime-miss-<first miss time> artifact, and the next run carries that time forward.
# the run turns red, and github mails the owner, once the first miss is four hours old. github skips many
# scheduled runs (the old four hour cron ran about twice a day), so the short cron is what keeps the alarm
# near four hours. the repo is public, so the minutes are free.
# turn it off from the actions tab if the laptop is going to be away for a while.
# hand runs: simulate_miss probes a dead address and threshold_minutes sets the alarm age, to test the chain.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      simulate_miss:
        description: "probe a dead address instead of the recognizer"
        type: boolean
        default: false
      threshold_minutes:
        description: "minutes down before the run turns red"
        type: string
        default: "240"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        run: python3 .github/scripts/uptime.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate_miss }}
          THRESHOLD_MIN: ${{ inputs.threshold_minutes || '240' }}
      - name: remember the first miss for the next run
        if: always() && steps.probe.outputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.probe.outputs.artifact }}
          path: uptime-miss.txt
          retention-days: 1

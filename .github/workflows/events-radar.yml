name: events radar sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"  # 3:23am Denver during MDT, once daily

permissions:
  contents: write

concurrency:
  group: events-radar
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run the sweep
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python3 .github/scripts/fetch_events.py

      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-events.json radar-attractions.json
          git diff --staged --quiet || (git commit -m "radar: nightly events refresh" && git push)

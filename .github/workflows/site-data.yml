name: site data

# the derived files the pages read, rebuilt after every push to main that a person or the laptop made,
# never after its own commits: the light sets page, the search index, the feed, the offline list, the
# shared tags on every page, the published artist count, one share card per artist, label and tracklist
# page, and the security tags.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: the derived files
        run: |
          python3 .github/scripts/lighten_sets.py
          python3 .github/scripts/build_search_index.py
          python3 .github/scripts/build_feed.py
          python3 .github/scripts/build_precache.py
          python3 .github/scripts/build_related.py
          python3 .github/scripts/build_tracks.py
          python3 .github/scripts/build_open_ids.py
          python3 .github/scripts/build_upcoming.py
          python3 .github/scripts/build_event_schema.py
          python3 .github/scripts/ensure_tags.py
          python3 .github/scripts/sync_counts.py
          python3 .github/scripts/crosslink_audit.py

      - name: share cards (only the pages whose name or subtitle changed)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_PATH=$PWD/node_modules node .github/scripts/share_cards.js

      - name: the security tags (fonts, referrer, content security policy with this push's script hashes)
        run: python3 .github/scripts/harden_pages.py

      - name: commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "site data: derived files, tags and share cards" && git push)

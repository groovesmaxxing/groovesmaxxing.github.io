name: site data

# the derived files the pages read: the search index, the light sets page, the newsletter feed.
# runs on every push to main that a person or the laptop made, never on its own commits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rebuild the derived files
        run: |
          python3 .github/scripts/lighten_sets.py
          python3 .github/scripts/build_search_index.py
          python3 .github/scripts/build_feed.py

      - name: commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json feed.xml sets.html sets-index.json
          git diff --staged --quiet || (git commit -m "site data: search index, feed, light sets page" && git push)
